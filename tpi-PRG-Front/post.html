<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/styles.css" />
    <title>TPI - PRG III</title>
  </head>
  <body>

    <header>

      <div class="header-content">

        <div class="logo-container">
          <img src="./img/logo.webp" alt="" />
        </div>

        <div class="nav-container">
          <nav>
            <ul class="nav-content">
              <li><a href="index.html">Inicio</a></li>
              <li><a href="get.html">Obtener</a></li>
              <li><a href="#">Crear</a></li>
              <li><a href="put.html">Modificar</a></li>
              <li><a href="delete.html">Eliminar</a></li>
            </ul>
          </nav>
        </div>

      </div>

    </header>

    
    <section class="form-section">

        <div class="form-container">
            
            <div class="form-title">
                <h2>Crear Producto</h2>
            </div>

            <form id="form-post">

                <label for="categoryProd">Categoria</label>
                <select name="category" id="categoryProd" required>
                    <option value="medications">medicamento</option>
                    <option value="sports supplements">suplemento deportivo</option>
                </select>

                <label for="image-prod">Imagen</label>
                <input type="text" name="image" id="image-prod" required>

                <label for="name-prod">Nombre</label>
                <input type="text" name="name" id="name-prod" required>
           
                <label for="price-prod">Precio</label>
                <input type="number" name="price" id="price-prod" required>
           
                <input type="submit" value="Crear Producto">
            </form>
        </div>
        
        <section id="contenedor-productos"></section>


    </section>

      <div id="contenedor-producto"></div>


    <script>
        const formularioCrearProducto = document.getElementById("form-post");
        const productContainer = document.getElementById("contenedor-producto");
        const urlBase = "http://localhost:25565";

        function validarFormulario(data){
            const errores = [];

            if(!data.name || data.name.trim().length < 2){
                errores.push("El nombre debe tener al menos dos caracteres")
            }

            if(!data.price || data.price < 0 ){
                errores.push("el precio debe ser mayor  a 0")
            }
            //validar imgs

            if(!data.category){
                errores.push("debe seleccionar una categoria");
            }

            return errores;
        }

        function mostrarListaErrores(array){
            let htmlErrores = "";

            array.foreach(error=>{
                htmlErrores+=`
                    <p class= "mensaje error}">${error}</p>
                ` 
            })
            contenedorProductos.innerHTML = htmlErrores;
        }

        function mostrarMensaje(estado,mensaje){
          productContainer.innerHTML = `<p class= "mensaje  ${estado} }">${mensaje}</p>`
        }

        const obtenerDatosForm=()=>{
            formularioCrearProducto.addEventListener("submit",async event=>{

                event.preventDefault();
                const formData = new FormData(event.target);
                const formObjJs = Object.fromEntries(formData.entries());
                
                formObjJs.price = Number(formObjJs.price);
                formObjJs.name = formObjJs.name.trim();
                
                const errores = validarFormulario(formObjJs);
                
                if(errores.length > 0){
                  console.error(errores);
                  return mostrarListaErrores(errores);
                }
                
                const formJson = JSON.stringify(formObjJs);

                try {
                    let respuesta = await fetch(`${urlBase}/api/products`,{
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        body: formJson
                    });

                    let data = await respuesta.json()
                    
                    let mensajeCompleto =`${data.message} con id ${data.productId}`

                    if(!respuesta.ok){
                        return mostrarMensaje("error",data.message);
                    }

                  mostrarMensaje("exito", mensajeCompleto)
                } catch (error) {
                  return mostrarMensaje("error", "error al enviar los datos")
                }

            })

        }

       obtenerDatosForm();
    </script>

  </body>
</html>
